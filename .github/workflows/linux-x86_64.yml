name: linux-x86_64

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**/*.livemd'
  push:
    branches:
      - main
      - feature-*
      - experimental-*
      - test-*
      - fix-*
    paths-ignore:
      - '**/*.md'
      - '**/*.livemd'
      - '.github/FUNDING.yml'
      - '.github/workflows/nerves-*'
      - '.github/workflows/macos-*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mix_test:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TFLITE_BEAM_CORAL_SUPPORT: "true"
      TFLITE_BEAM_PREFER_PRECOMPILED: "true"
      # The LiteRT tests skip themselves without this, and skipping reads as
      # passing: the suite went green for a whole release while twelve cases
      # never ran. It selects the precompiled variant that carries the API.
      TFLITE_BEAM_ENABLE_LITERT_API: "true"

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "26"
          elixir-version: "1.16"

      - name: Install system dependecies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential automake autoconf pkg-config bc m4 unzip zip curl git libssl-dev libncurses5-dev ca-certificates

      - name: Compile and Test
        run: |
          mix deps.get
          # a formatting drift nobody is watching becomes a diff nobody can read
          mix format --check-formatted
          mix test
